<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>DELIMa Flash Card · 纸质马卡龙清新动画闪卡</title>
  <style>
    :root {
      --desk-bg: #F4EFE6;
      --paper: #FFFDF9;
      --paper-warm: #FAF6ED;
      --ink: #2C2A29;
      --muted: #767067;
      --line: #E6DEC8;

      /* 马卡龙色盘 */
      --mint-bg: #E2F4EC;
      --mint-bd: #97D6BC;
      --mint-tx: #1F634A;

      --peach-bg: #FFE9E1;
      --peach-bd: #F2A890;
      --peach-tx: #963E23;

      --butter-bg: #FFF5D2;
      --butter-bd: #E8C76B;
      --butter-tx: #78550B;

      --lav-bg: #EFEAFA;
      --lav-bd: #BEB0E6;
      --lav-tx: #4B3980;

      --sky-bg: #E4F2FC;
      --sky-bd: #93C5EA;
      --sky-tx: #1F5780;

      /* 当前学科主色（JS 动态切换） */
      --accent: #EA8F75;
      --accent-soft: #FFE9E1;
      --accent-tx: #963E23;
      --stack-back: #DDF1E7;
      --stack-back-bd: #B6DEC9;

      --serif: Georgia, "Noto Serif SC", "Songti SC", serif;
      --sans: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 15%, rgba(255, 233, 225, 0.7) 0%, transparent 45%),
        radial-gradient(circle at 84% 85%, rgba(226, 244, 236, 0.75) 0%, transparent 48%),
        var(--desk-bg);
      font-family: var(--sans);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1:1 正方形舞台 */
    .stage-shell {
      position: relative;
      width: min(100vw, 100vh, 620px);
      height: min(100vw, 100vh, 620px);
      aspect-ratio: 1 / 1;
      padding: 20px 18px 18px;
      display: flex;
    }

    /* 底层垫纸：制造实体多张马卡龙卡纸叠放感 */
    .stack-under {
      position: absolute;
      inset: 22px 20px 16px;
      border-radius: 26px;
      background: var(--stack-back);
      border: 1.5px solid var(--stack-back-bd);
      transform: rotate(-2.1deg) translate(-2px, 3px);
      box-shadow: 0 10px 26px rgba(60, 52, 42, 0.07);
      transition: background-color 0.45s ease, border-color 0.45s ease;
      pointer-events: none;
    }

    .stack-under-2 {
      position: absolute;
      inset: 22px 20px 16px;
      border-radius: 26px;
      background: var(--butter-bg);
      border: 1.5px solid #EBD794;
      transform: rotate(1.6deg) translate(3px, 2px);
      pointer-events: none;
    }

    /* 顶部和纸胶带（Washi Tape） */
    .washi-tape {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 118px;
      height: 22px;
      z-index: 6;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.38) 0px,
          rgba(255, 255, 255, 0.38) 6px,
          transparent 6px,
          transparent 12px
        ),
        rgba(151, 214, 188, 0.72);
      border-left: 2px dotted rgba(255, 255, 255, 0.75);
      border-right: 2px dotted rgba(255, 255, 255, 0.75);
      box-shadow: 0 2px 6px rgba(44, 42, 41, 0.09);
      pointer-events: none;
    }

    /* 主实体卡纸 */
    .card-frame {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      background: var(--paper);
      border: 1.5px solid #DED5C3;
      border-radius: 26px;
      box-shadow:
        0 14px 30px rgba(66, 56, 44, 0.08),
        0 2px 0 #E8DFCE,
        inset 0 1px 0 #FFFFFF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 20px 20px 14px;
    }

    /* 纯内联 SVG 细腻纸纹肌理 */
    .paper-grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.24;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    /* 左上角活页打孔小圆圈 */
    .punch-hole {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--desk-bg);
      border: 1px solid #D5CCB8;
      box-shadow: inset 0 1.5px 3px rgba(44, 42, 41, 0.16);
      z-index: 4;
    }

    .card-frame > *:not(.paper-grain):not(.punch-hole):not(.confetti-layer) {
      position: relative;
      z-index: 3;
    }

    /* 顶部进度分段条（圆润马卡龙胶囊条） */
    .progress-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 0 18px 12px 22px;
      flex-shrink: 0;
    }

    .prog-track {
      height: 6px;
      background: #EFE9DA;
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }

    .prog-fill {
      width: 100%;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
    }

    .prog-track.done .prog-fill {
      transform: scaleX(1);
    }

    /* 顶栏 */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-soft);
      border: 1.5px solid var(--accent);
      color: var(--accent-tx);
      white-space: nowrap;
    }

    .unit-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--paper-warm);
      border: 1px dashed #D6CCB8;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1.5px solid #DED5C3;
      background: #FFFFFF;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 #E7DEC9;
      transition: transform 0.14s ease, background-color 0.2s ease;
    }

    .ctrl-btn:hover {
      background: var(--paper-warm);
    }

    .ctrl-btn:active {
      transform: translateY(1.5px);
      box-shadow: 0 0 0 #E7DEC9;
    }

    /* 舞台内容区 */
    .viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      perspective: 1100px;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      transform: translateX(28px) rotate(1deg) scale(0.97);
      pointer-events: none;
      transition:
        opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .scene.active {
      opacity: 1;
      transform: translateX(0) rotate(0deg) scale(1);
      pointer-events: auto;
    }

    .scene.leaving {
      opacity: 0;
      transform: translateX(-28px) rotate(-1deg) scale(0.97);
    }

    .eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.9px;
      color: var(--accent-tx);
      margin-bottom: 8px;
    }

    /* 第 1 幕：粉彩纸质感词卡 */
    .hero-card {
      position: relative;
      height: 100%;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.95) 0%, var(--paper-warm) 100%);
      border: 1.5px solid #E7DFCE;
      border-radius: 22px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.7);
    }

    /* 虚线内框手账缝线 */
    .hero-card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: 1.5px dashed rgba(196, 184, 160, 0.55);
      pointer-events: none;
    }

    .hero-visual {
      width: 94px;
      height: 94px;
      border-radius: 28px;
      background: var(--mint-bg);
      border: 2px solid var(--mint-bd);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 5px 0 rgba(151, 214, 188, 0.45);
      transform: scale(0.84) rotate(-4deg);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.06s, opacity 0.4s ease 0.06s;
    }

    .scene.active .hero-visual {
      transform: scale(1) rotate(-2deg);
      opacity: 1;
      animation: macaronFloat 3.8s ease-in-out 0.6s infinite;
    }

    @keyframes macaronFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }

    .hero-visual svg {
      width: 52px;
      height: 52px;
      stroke: var(--mint-tx);
      fill: none;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-visual svg path, .hero-visual svg circle, .hero-visual svg rect {
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transition: stroke-dashoffset 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.16s;
    }

    .scene.active .hero-visual svg path,
    .scene.active .hero-visual svg circle,
    .scene.active .hero-visual svg rect {
      stroke-dashoffset: 0;
    }

    .hero-word {
      font-family: var(--serif);
      font-size: clamp(32px, 7.5vw, 44px);
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 8px;
      line-height: 1.15;
      transform: translateY(10px);
      opacity: 0;
      transition: transform 0.48s ease 0.14s, opacity 0.48s ease 0.14s;
    }

    .scene.active .hero-word {
      transform: translateY(0);
      opacity: 1;
    }

    .hero-sub {
      font-size: 16px;
      font-weight: 600;
      color: var(--mint-tx);
      margin: 0 0 18px;
      max-width: 90%;
    }

    /* 马卡龙手账便利贴标签 */
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 13px;
      font-size: 13.5px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(14px) scale(0.92);
      transition: opacity 0.4s ease, transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .chip:nth-child(1) {
      background: var(--peach-bg);
      border: 1.5px solid var(--peach-bd);
      color: var(--peach-tx);
      box-shadow: 0 3px 0 rgba(242, 168, 144, 0.45);
      --rot: -1.6deg;
    }
    .chip:nth-child(2) {
      background: var(--butter-bg);
      border: 1.5px solid var(--butter-bd);
      color: var(--butter-tx);
      box-shadow: 0 3px 0 rgba(232, 199, 107, 0.45);
      --rot: 1.1deg;
    }
    .chip:nth-child(3) {
      background: var(--lav-bg);
      border: 1.5px solid var(--lav-bd);
      color: var(--lav-tx);
      box-shadow: 0 3px 0 rgba(190, 176, 230, 0.45);
      --rot: -0.9deg;
    }

    .scene.active .chip:nth-child(1) { transition-delay: 0.25s; opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); }
    .scene.active .chip:nth-child(2) { transition-delay: 0.40s; opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); }
    .scene.active .chip:nth-child(3) { transition-delay: 0.55s; opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); }

    /* 第 2 幕：马卡龙双色卡纸对比 */
    .vs-wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .vs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      flex: 1;
      max-height: 365px;
      align-items: stretch;
    }

    .vs-box {
      border-radius: 22px;
      padding: 20px 15px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateY(16px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }

    .vs-box.left {
      background: var(--mint-bg);
      border: 1.5px solid var(--mint-bd);
      box-shadow: 0 5px 0 rgba(151, 214, 188, 0.48);
    }

    .vs-box.right {
      background: var(--peach-bg);
      border: 1.5px solid var(--peach-bd);
      box-shadow: 0 5px 0 rgba(242, 168, 144, 0.48);
    }

    .scene.active .vs-box.left { transition-delay: 0.10s; opacity: 1; transform: translateY(0) rotate(-0.6deg); }
    .scene.active .vs-box.right { transition-delay: 0.26s; opacity: 1; transform: translateY(0) rotate(0.6deg); }

    .vs-term {
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .vs-box.left .vs-term { color: var(--mint-tx); }
    .vs-box.right .vs-term { color: var(--peach-tx); }

    .vs-desc {
      font-size: 13px;
      color: var(--ink);
      opacity: 0.82;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .vs-examples {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .vs-examples li {
      font-size: 13px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    /* 第 3 幕：手账撕边例句卡 */
    .sentence-card {
      position: relative;
      background: var(--sky-bg);
      border: 1.5px solid var(--sky-bd);
      border-radius: 22px;
      padding: 24px 22px;
      flex: 1;
      max-height: 365px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 5px 0 rgba(147, 197, 234, 0.45);
    }

    .sentence-bm {
      font-family: var(--serif);
      font-size: clamp(19px, 3.6vw, 23px);
      line-height: 1.65;
      color: var(--ink);
      margin: 0;
      background: rgba(255, 255, 255, 0.72);
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    .hl {
      display: inline-block;
      padding: 0 8px;
      border-radius: 9px;
      background: var(--butter-bg);
      color: var(--butter-tx);
      font-weight: 700;
      border: 1.5px solid var(--butter-bd);
      box-shadow: 0 2px 0 rgba(232, 199, 107, 0.5);
    }

    .scene.active .hl {
      animation: spotlightPulse 1.8s ease-in-out 0.3s 1;
    }

    @keyframes spotlightPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      45% { transform: scale(1.07) rotate(-1.5deg); }
    }

    .sentence-zh {
      margin: 0;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--sky-tx);
      padding-left: 12px;
      border-left: 3.5px solid var(--sky-bd);
    }

    .tip-pill {
      background: var(--butter-bg);
      border: 1.5px dashed var(--butter-bd);
      color: var(--butter-tx);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      font-weight: 700;
    }

    /* 第 4 幕：马卡龙 3D 翻卡 */
    .flip-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.74s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .flip-wrap.flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--lav-bg);
      border: 1.5px solid var(--lav-bd);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 5px 0 rgba(190, 176, 230, 0.45);
    }

    .flip-back {
      transform: rotateY(180deg);
      background: var(--mint-bg);
      border-color: var(--mint-bd);
      box-shadow: 0 5px 0 rgba(151, 214, 188, 0.48);
      justify-content: center;
      text-align: center;
      gap: 14px;
    }

    .quiz-q {
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.5;
      margin: 4px 0 12px;
      color: var(--ink);
    }

    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .opt-btn {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1.5px solid #DCD4EC;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 0 rgba(190, 176, 230, 0.35);
      transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .opt-btn:hover {
      border-color: var(--accent);
      background: var(--peach-bg);
      transform: translateY(-1px);
    }

    .opt-btn.correct {
      background: var(--mint-bg);
      border-color: var(--mint-bd);
      color: var(--mint-tx);
      box-shadow: 0 3px 0 rgba(151, 214, 188, 0.5);
    }

    .opt-btn.wrong {
      background: #FFE5E5;
      border-color: #EA9E9E;
      color: #8C2B2B;
    }

    .ans-big {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 700;
      color: var(--mint-tx);
      margin: 0;
    }

    .ans-explain {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--ink);
      margin: 0;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 16px;
      border: 1.5px dashed var(--mint-bd);
    }

    /* 马卡龙纸屑动效 */
    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
    }

    .confetti-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 3px;
      opacity: 0;
      animation: confettiPop 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes confettiPop {
      0% { opacity: 1; transform: translate(0, 0) scale(0.7) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--deg)); }
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .hero-word, .chip, .vs-box, .flip-wrap, .hero-visual {
        transition: none !important;
        animation: none !important;
      }
      .scene.active .hero-word, .scene.active .chip, .scene.active .vs-box, .scene.active .hero-visual {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage-shell">
    <!-- 叠放垫底卡纸 + 顶部胶带 -->
    <div class="stack-under-2" aria-hidden="true"></div>
    <div class="stack-under" aria-hidden="true"></div>
    <div class="washi-tape" aria-hidden="true"></div>

    <section class="card-frame" aria-label="纸质马卡龙自动播放学习闪卡">
      <!-- 纯离线 SVG 纸纹滤镜 -->
      <svg class="paper-grain" aria-hidden="true">
        <filter id="paperNoise">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#paperNoise)" />
      </svg>

      <div class="punch-hole" aria-hidden="true"></div>
      <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

      <!-- 顶部 4 幕进度条 -->
      <div class="progress-row" id="progressRow">
        <div class="prog-track" data-step="0" title="第 1 幕：核心概念"><div class="prog-fill"></div></div>
        <div class="prog-track" data-step="1" title="第 2 幕：对比辨析"><div class="prog-fill"></div></div>
        <div class="prog-track" data-step="2" title="第 3 幕：例句聚光"><div class="prog-fill"></div></div>
        <div class="prog-track" data-step="3" title="第 4 幕：快问快答"><div class="prog-fill"></div></div>
      </div>

      <!-- 顶栏信息与控制按钮 -->
      <header class="header-bar">
        <div class="badge-group">
          <span class="badge" id="uiSubject">Bahasa Melayu</span>
          <span class="unit-tag" id="uiUnit">Penjodoh Bilangan</span>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="prevBtn" type="button" title="上一幕">&lt;</button>
          <button class="ctrl-btn" id="playBtn" type="button">暂停</button>
          <button class="ctrl-btn" id="nextBtn" type="button" title="下一幕">&gt;</button>
        </div>
      </header>

      <!-- 4 幕主舞台 -->
      <div class="viewport" id="viewport">
        <!-- 第 1 幕：概念引入 -->
        <article class="scene active" data-scene="0">
          <div class="hero-card">
            <div class="hero-visual" id="uiVisual" aria-hidden="true"></div>
            <div class="eyebrow" id="uiEyebrow">1 / 4 · 核心词卡</div>
            <h1 class="hero-word" id="uiHeroWord">seutas</h1>
            <p class="hero-sub" id="uiHeroMeaning"></p>
            <div class="chip-list" id="uiChips"></div>
          </div>
        </article>

        <!-- 第 2 幕：对比辨析 -->
        <article class="scene" data-scene="1">
          <div class="vs-wrap">
            <div class="eyebrow">2 / 4 · 易混对比（注意区分）</div>
            <div class="vs-grid">
              <div class="vs-box left">
                <div>
                  <h2 class="vs-term" id="uiLeftTerm"></h2>
                  <p class="vs-desc" id="uiLeftDesc"></p>
                </div>
                <ul class="vs-examples" id="uiLeftExamples"></ul>
              </div>
              <div class="vs-box right">
                <div>
                  <h2 class="vs-term" id="uiRightTerm"></h2>
                  <p class="vs-desc" id="uiRightDesc"></p>
                </div>
                <ul class="vs-examples" id="uiRightExamples"></ul>
              </div>
            </div>
          </div>
        </article>

        <!-- 第 3 幕：情境例句 -->
        <article class="scene" data-scene="2">
          <div class="vs-wrap">
            <div class="eyebrow">3 / 4 · 情境例句与记忆点</div>
            <div class="sentence-card">
              <p class="sentence-bm" id="uiSentence"></p>
              <p class="sentence-zh" id="uiTranslation"></p>
              <div class="tip-pill" id="uiTip"></div>
            </div>
          </div>
        </article>

        <!-- 第 4 幕：3D 翻转题目 -->
        <article class="scene" data-scene="3">
          <div class="flip-wrap" id="flipWrap">
            <div class="flip-face">
              <div>
                <div class="eyebrow">4 / 4 · 快问快答（点击作答或等待自动翻卡）</div>
                <div class="quiz-q" id="uiQuizQ"></div>
                <div class="opt-list" id="uiQuizOpts"></div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:12px;color:var(--lav-tx)" id="uiQuizHint">提示：选出正确答案，或 4 秒后自动揭晓</span>
                <button class="ctrl-btn" id="flipNowBtn" type="button">看答案</button>
              </div>
            </div>
            <div class="flip-face flip-back">
              <div class="eyebrow">正确答案</div>
              <p class="ans-big" id="uiAnsText"></p>
              <p class="ans-explain" id="uiAnsExplain"></p>
              <div>
                <button class="ctrl-btn" id="replayBtn" type="button">再看一遍</button>
              </div>
            </div>
          </div>
        </article>
      </div>

      <footer class="footer-bar">
        <div style="display:flex;align-items:center;gap:6px">
          <button class="ctrl-btn" id="switchDemoBtn" type="button" style="height:26px;font-size:11px;padding:0 9px;border-radius:8px">换学科样例 (1/3)</button>
        </div>
        <span id="uiStageLabel">第 1 / 4 幕</span>
      </footer>
    </section>
  </main>

  <script>
    const SAMPLES = [
      {
        theme: { accent: "#EA8F75", soft: "#FFE9E1", tx: "#963E23", stack: "#DDF1E7", stackBd: "#B6DEC9" },
        subject: "Bahasa Melayu",
        unit: "Penjodoh Bilangan",
        word: "seutas",
        meaning: "一条 / 一串（用于细长、柔软或成串的物品）",
        chips: ["seutas jam tangan 手表", "seutas rantai 项链", "seutas tali 绳子"],
        iconSvg: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14"></circle><path d="M23 19 L25 8 L39 8 L41 19"></path><path d="M23 45 L25 56 L39 56 L41 45"></path><path d="M32 25 L32 32 L37 35"></path></svg>`,
        compare: {
          left: { term: "seutas", desc: "软、可弯曲或可佩戴的长条物", items: ["jam tangan 手表", "rantai 项链", "tali pinggang 腰带"] },
          right: { term: "sebatang", desc: "长条形、较硬、笔直的物体", items: ["pensel 铅笔", "pokok 树木", "sungai 河流"] }
        },
        sentenceBefore: "Ibu memakai ",
        sentenceHighlight: "seutas",
        sentenceAfter: " rantai emas yang cantik ke majlis itu.",
        translation: "妈妈戴着一条漂亮的金项链去参加那个宴会。",
        tip: "记忆口诀：能绕在手腕或脖子上的柔软长物（手表/项链/绳子），选 seutas！",
        quiz: {
          question: "Ayah membeli _____ tali nilon untuk mengikat kotak itu.",
          options: ["A. sebatang", "B. seutas", "C. sebiji"],
          answerIndex: 1,
          answerText: "B. seutas",
          explain: "tali nilon（尼龙绳）是细长且柔软可弯曲的物品，所以量词用 seutas，不用 sebatang。"
        }
      },
      {
        theme: { accent: "#E2BA4E", soft: "#FFF5D2", tx: "#78550B", stack: "#FFE9E1", stackBd: "#F2C4B4" },
        subject: "Bahasa Cina · 华文",
        unit: "形近字辨析",
        word: "燥 vs 躁",
        meaning: "火字旁怕水（干燥）；足字旁易动（急躁）",
        chips: ["干燥 gān zào", "急躁 jí zào", "枯燥 kū zào"],
        iconSvg: `<svg viewBox="0 0 64 64"><path d="M32 10 C38 22 46 28 46 39 A14 14 0 1 1 18 39 C18 28 26 22 32 10 Z"></path><path d="M26 43 C26 37 32 33 32 27 C35 32 38 36 38 43"></path></svg>`,
        compare: {
          left: { term: "燥（火字旁）", desc: "缺水分、天气或空气干", items: ["干燥（天气干燥）", "枯燥（内容枯燥）", "燥热（闷热无风）"] },
          right: { term: "躁（足字旁）", desc: "情绪急、坐立不安乱跺脚", items: ["急躁（脾气急躁）", "烦躁（心里烦躁）", "戒骄戒躁"] }
        },
        sentenceBefore: "遇到难题时不要",
        sentenceHighlight: "急躁",
        sentenceAfter: "，先深呼吸再检查一次算式。",
        translation: "口诀：有火就「燥」（缺水干）；跺脚才「躁」（发脾气）。",
        tip: "记偏旁最稳：沙漠起火缺水分是「燥」，生气跺脚跳起来是「躁」！",
        quiz: {
          question: "最近天气十分干（ ），同学们记得多喝水。",
          options: ["A. 躁", "B. 燥", "C. 澡"],
          answerIndex: 1,
          answerText: "B. 燥（干燥）",
          explain: "天气缺水、没有湿度，与「火/干热」有关，所以用火字旁的「燥」。"
        }
      },
      {
        theme: { accent: "#9B88D4", soft: "#EFEAFA", tx: "#4B3980", stack: "#E4F2FC", stackBd: "#B6D8F2" },
        subject: "Sejarah · Tahun 4",
        unit: "Kesultanan Melayu Melaka",
        word: "Parameswara",
        meaning: "马六甲王朝创立者（约 1400 年建国）",
        chips: ["Palembang 巨港", "Temasik 淡马锡", "Melaka 马六甲"],
        iconSvg: `<svg viewBox="0 0 64 64"><path d="M12 46 L16 22 L27 32 L32 14 L37 32 L48 22 L52 46 Z"></path><rect x="12" y="46" width="40" height="6" rx="2"></rect></svg>`,
        compare: {
          left: { term: "地理优势", desc: "马六甲海峡核心位置", items: ["避开季风（天然良港）", "水深适合大船停靠", "山丘便于瞭望守卫"] },
          right: { term: "建国故事", desc: "鼠鹿踢猎犬（Pelanduk）", items: ["树下休息见鼠鹿踢狗", "认为此处吉祥有灵气", "以树名命名 Melaka"] }
        },
        sentenceBefore: "Parameswara menamakan tempat itu Melaka bersempena dengan nama ",
        sentenceHighlight: "pokok Melaka",
        sentenceAfter: ".",
        translation: "拜里米苏拉以当时倚靠休息的「马六甲树」为此地命名。",
        tip: "考试高频点：为何选马六甲？① 避季风（Terlindung daripada tiupan angin monsun） ② 鼠鹿传说！",
        quiz: {
          question: "Apakah haiwan yang dilihat oleh Parameswara menendang anjing perburuannya?",
          options: ["A. Harimau", "B. Pelanduk", "C. Kancil putih"],
          answerIndex: 1,
          answerText: "B. Pelanduk（鼠鹿）",
          explain: "在马来纪年课本标准表述中，Parameswara 看到的是 pelanduk（鼠鹿）勇敢反击猎犬。"
        }
      }
    ];

    const DEFAULT_CARD = SAMPLES[0];

    function loadCardData() {
      try {
        const params = new URLSearchParams(location.search);
        const raw = params.get("d");
        if (!raw) return DEFAULT_CARD;
        const bin = atob(raw.replace(/-/g, "+").replace(/_/g, "/"));
        const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
        const parsed = JSON.parse(new TextDecoder().decode(bytes));
        return {
          ...DEFAULT_CARD,
          ...parsed,
          theme: { ...DEFAULT_CARD.theme, ...(parsed.theme || {}) },
          iconSvg: parsed.iconSvg || DEFAULT_CARD.iconSvg,
          chips: Array.isArray(parsed.chips) ? parsed.chips : DEFAULT_CARD.chips,
          compare: {
            left: { ...DEFAULT_CARD.compare.left, ...((parsed.compare && parsed.compare.left) || {}) },
            right: { ...DEFAULT_CARD.compare.right, ...((parsed.compare && parsed.compare.right) || {}) }
          },
          quiz: { ...DEFAULT_CARD.quiz, ...(parsed.quiz || {}) }
        };
      } catch (e) {
        return DEFAULT_CARD;
      }
    }

    let sampleIdx = 0;
    let card = loadCardData();

    function applyTheme(t) {
      if (!t) return;
      const root = document.documentElement.style;
      root.setProperty("--accent", t.accent);
      root.setProperty("--accent-soft", t.soft);
      root.setProperty("--accent-tx", t.tx);
      root.setProperty("--stack-back", t.stack);
      root.setProperty("--stack-back-bd", t.stackBd);
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.07);
          osc.stop(ctx.currentTime + i * 0.07 + 0.26);
        });
      } catch (_) {}
    }

    function burstConfetti() {
      const layer = document.getElementById("confettiLayer");
      const colors = ["#97D6BC", "#F2A890", "#E8C76B", "#BEB0E6", "#93C5EA"];
      for (let i = 0; i < 20; i++) {
        const dot = document.createElement("span");
        dot.className = "confetti-dot";
        dot.style.left = "50%";
        dot.style.top = "52%";
        dot.style.background = colors[i % colors.length];
        const ang = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5) * 0.3;
        const dist = 80 + Math.random() * 140;
        dot.style.setProperty("--dx", `${Math.cos(ang) * dist}px`);
        dot.style.setProperty("--dy", `${Math.sin(ang) * dist}px`);
        dot.style.setProperty("--deg", `${Math.round(Math.random() * 360)}deg`);
        layer.appendChild(dot);
        setTimeout(() => dot.remove(), 950);
      }
    }

    function renderCard(c) {
      applyTheme(c.theme);
      document.getElementById("uiVisual").innerHTML = c.iconSvg || SAMPLES[0].iconSvg;
      document.getElementById("uiSubject").textContent = c.subject;
      document.getElementById("uiUnit").textContent = c.unit;
      document.getElementById("uiHeroWord").textContent = c.word;
      document.getElementById("uiHeroMeaning").textContent = c.meaning;

      const chipsEl = document.getElementById("uiChips");
      chipsEl.innerHTML = "";
      c.chips.forEach((txt) => {
        const span = document.createElement("span");
        span.className = "chip";
        span.textContent = txt;
        chipsEl.appendChild(span);
      });

      document.getElementById("uiLeftTerm").textContent = c.compare.left.term;
      document.getElementById("uiLeftDesc").textContent = c.compare.left.desc;
      const leftUl = document.getElementById("uiLeftExamples");
      leftUl.innerHTML = "";
      c.compare.left.items.forEach((it) => {
        const li = document.createElement("li");
        li.textContent = it;
        leftUl.appendChild(li);
      });

      document.getElementById("uiRightTerm").textContent = c.compare.right.term;
      document.getElementById("uiRightDesc").textContent = c.compare.right.desc;
      const rightUl = document.getElementById("uiRightExamples");
      rightUl.innerHTML = "";
      c.compare.right.items.forEach((it) => {
        const li = document.createElement("li");
        li.textContent = it;
        rightUl.appendChild(li);
      });

      const sentEl = document.getElementById("uiSentence");
      sentEl.innerHTML = "";
      sentEl.appendChild(document.createTextNode(c.sentenceBefore));
      const hl = document.createElement("span");
      hl.className = "hl";
      hl.textContent = c.sentenceHighlight;
      sentEl.appendChild(hl);
      sentEl.appendChild(document.createTextNode(c.sentenceAfter));

      document.getElementById("uiTranslation").textContent = c.translation;
      document.getElementById("uiTip").textContent = c.tip;

      document.getElementById("uiQuizQ").textContent = c.quiz.question;
      document.getElementById("uiAnsText").textContent = c.quiz.answerText;
      document.getElementById("uiAnsExplain").textContent = c.quiz.explain;

      const optsEl = document.getElementById("uiQuizOpts");
      optsEl.innerHTML = "";
      c.quiz.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt-btn";
        btn.innerHTML = `<span></span><span></span>`;
        btn.firstElementChild.textContent = opt;
        btn.addEventListener("click", () => handleAnswer(idx, btn));
        optsEl.appendChild(btn);
      });
    }

    const DURATIONS = [4200, 4600, 4800, 7200];
    const scenes = Array.from(document.querySelectorAll(".scene"));
    const tracks = Array.from(document.querySelectorAll(".prog-track"));
    const fills = tracks.map((t) => t.querySelector(".prog-fill"));
    const flipWrap = document.getElementById("flipWrap");
    const playBtn = document.getElementById("playBtn");
    const stageLabel = document.getElementById("uiStageLabel");

    let current = 0;
    let elapsed = 0;
    let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let flipped = false;
    let lastTick = performance.now();

    function updatePlayLabel() {
      playBtn.textContent = playing ? "暂停" : "播放";
    }

    function setScene(nextIdx) {
      const prevIdx = current;
      current = (nextIdx + scenes.length) % scenes.length;
      elapsed = 0;
      flipped = false;
      flipWrap.classList.remove("flipped");

      scenes.forEach((s, i) => {
        s.classList.remove("active", "leaving");
        if (i === current) s.classList.add("active");
        else if (i === prevIdx && prevIdx !== current) s.classList.add("leaving");
      });

      tracks.forEach((t, i) => {
        t.classList.toggle("done", i < current);
        fills[i].style.transform = i < current ? "scaleX(1)" : "scaleX(0)";
      });

      stageLabel.textContent = `第 ${current + 1} / ${scenes.length} 幕`;
      document.querySelectorAll(".opt-btn").forEach((b) => {
        b.classList.remove("correct", "wrong");
        b.lastElementChild.textContent = "";
      });
    }

    function handleAnswer(idx, btn) {
      const ok = idx === card.quiz.answerIndex;
      btn.classList.add(ok ? "correct" : "wrong");
      btn.lastElementChild.textContent = ok ? "正确" : "再想想";
      if (ok) {
        playChime();
        burstConfetti();
        setTimeout(() => {
          flipped = true;
          flipWrap.classList.add("flipped");
        }, 550);
      }
    }

    function tick(now) {
      const dt = now - lastTick;
      lastTick = now;

      if (playing) {
        elapsed += dt;
        const dur = DURATIONS[current];
        const ratio = Math.min(1, elapsed / dur);
        fills[current].style.transform = `scaleX(${ratio})`;

        if (current === 3 && !flipped && elapsed >= 4000) {
          flipped = true;
          flipWrap.classList.add("flipped");
        }
        if (elapsed >= dur) {
          setScene(current + 1);
        }
      }
      requestAnimationFrame(tick);
    }

    playBtn.addEventListener("click", () => {
      playing = !playing;
      updatePlayLabel();
    });
    document.getElementById("prevBtn").addEventListener("click", () => setScene(current - 1));
    document.getElementById("nextBtn").addEventListener("click", () => setScene(current + 1));
    document.getElementById("flipNowBtn").addEventListener("click", () => {
      flipped = !flipped;
      flipWrap.classList.toggle("flipped", flipped);
    });
    document.getElementById("replayBtn").addEventListener("click", () => setScene(0));
    tracks.forEach((t) => {
      t.addEventListener("click", () => setScene(Number(t.dataset.step)));
    });

    const switchBtn = document.getElementById("switchDemoBtn");
    switchBtn.addEventListener("click", () => {
      sampleIdx = (sampleIdx + 1) % SAMPLES.length;
      card = SAMPLES[sampleIdx];
      switchBtn.textContent = `换学科样例 (${sampleIdx + 1}/${SAMPLES.length})`;
      renderCard(card);
      setScene(0);
    });

    renderCard(card);
    updatePlayLabel();
    setScene(0);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
