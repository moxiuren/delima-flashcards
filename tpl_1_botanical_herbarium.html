<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>模板 01 · 复古博物手稿风 (Herbarium)</title>
  <style>
    :root {
      --paper: #F5F0E3;
      --paper-inner: #FAF7EE;
      --ink: #1F2B24;
      --muted: #5F6B63;
      --forest: #214D3B;
      --ochre: #A95330;
      --ochre-soft: #F3E5DC;
      --gold: #8C6D2E;
      --line: #C7BFA9;
      --serif: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
      --sans: "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #E8E1D1; font-family: var(--sans); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
    }
    .stage {
      width: min(100vw, 100vh, 620px);
      height: min(100vw, 100vh, 620px);
      aspect-ratio: 1 / 1;
      padding: 14px;
    }
    .folio {
      position: relative; width: 100%; height: 100%;
      background: var(--paper);
      border: 1.5px solid #B5AC94;
      box-shadow: 0 14px 30px rgba(31, 43, 36, 0.12);
      padding: 20px 22px 16px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    /* 双层铜版内框 + 四角定位十字 */
    .folio::before {
      content: ""; position: absolute; inset: 10px;
      border: 1px solid var(--line); pointer-events: none;
    }
    .corner {
      position: absolute; width: 12px; height: 12px; pointer-events: none; z-index: 4;
    }
    .corner::before, .corner::after {
      content: ""; position: absolute; background: var(--forest); opacity: 0.55;
    }
    .corner::before { left: 5px; top: 0; width: 1px; height: 12px; }
    .corner::after { top: 5px; left: 0; height: 1px; width: 12px; }
    .c-tl { top: 4px; left: 4px; } .c-tr { top: 4px; right: 4px; }
    .c-bl { bottom: 4px; left: 4px; } .c-br { bottom: 4px; right: 4px; }

    .paper-tex {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0.22; pointer-events: none; mix-blend-mode: multiply;
    }
    .folio > *:not(.corner):not(.paper-tex) { position: relative; z-index: 2; }

    /* 顶部索引刻度与进度 */
    .prog-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin-bottom: 12px; flex-shrink: 0;
    }
    .prog-track {
      height: 4px; background: rgba(33, 77, 59, 0.14); cursor: pointer; overflow: hidden;
    }
    .prog-fill {
      width: 100%; height: 100%; background: var(--forest);
      transform-origin: left; transform: scaleX(0);
    }
    .prog-track.done .prog-fill { transform: scaleX(1); }

    .hdr {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px;
      flex-shrink: 0;
    }
    .specimen-meta { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .fig-no {
      font-family: var(--serif); font-style: italic; font-size: 13px; font-weight: 700;
      color: var(--ochre); letter-spacing: 0.5px;
    }
    .subj { font-size: 13px; font-weight: 700; color: var(--forest); letter-spacing: 0.6px; text-transform: uppercase; }
    .unit { font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ctrls { display: flex; gap: 5px; flex-shrink: 0; }
    .btn {
      height: 28px; padding: 0 9px; border: 1px solid #9E9681; background: var(--paper-inner);
      color: var(--ink); font-size: 11.5px; font-weight: 600; cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn:hover { background: #EAE2CE; }

    .viewport { position: relative; flex: 1; min-height: 0; }
    .scene {
      position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene.active { opacity: 1; transform: translateY(0); pointer-events: auto; }

    /* 第 1 幕：标本铭牌 */
    .plate-box {
      height: 100%; background: var(--paper-inner); border: 1px solid var(--line);
      padding: 20px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .stamp-ring {
      width: 86px; height: 86px; border-radius: 50%; border: 1.5px dashed var(--ochre);
      display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
      background: radial-gradient(circle, rgba(169, 83, 50, 0.08) 0%, transparent 72%);
      transform: scale(1.16) rotate(-6deg); opacity: 0;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s, opacity 0.45s ease 0.08s;
    }
    .scene.active .stamp-ring { transform: scale(1) rotate(0deg); opacity: 1; }
    .stamp-ring svg { width: 44px; height: 44px; stroke: var(--forest); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .stamp-ring svg path, .stamp-ring svg circle, .stamp-ring svg rect {
      stroke-dasharray: 220; stroke-dashoffset: 220;
      transition: stroke-dashoffset 1.1s ease 0.2s;
    }
    .scene.active .stamp-ring svg path, .scene.active .stamp-ring svg circle, .scene.active .stamp-ring svg rect { stroke-dashoffset: 0; }

    .latin-word {
      font-family: var(--serif); font-size: clamp(32px, 7vw, 42px); font-weight: 700;
      margin: 0 0 8px; color: var(--ink); letter-spacing: 0.4px;
    }
    .meaning { font-size: 15.5px; color: var(--forest); font-weight: 600; margin: 0 0 18px; }
    .tag-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .spec-tag {
      padding: 6px 12px; border: 1px solid var(--forest); background: rgba(33, 77, 59, 0.05);
      font-size: 13px; font-weight: 600; color: var(--forest);
      opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .scene.active .spec-tag:nth-child(1) { transition-delay: 0.22s; opacity: 1; transform: none; }
    .scene.active .spec-tag:nth-child(2) { transition-delay: 0.36s; opacity: 1; transform: none; }
    .scene.active .spec-tag:nth-child(3) { transition-delay: 0.50s; opacity: 1; transform: none; }

    /* 第 2 幕：图鉴对开对比页 */
    .spread {
      display: grid; grid-template-columns: 1fr 1fr; height: 100%; max-height: 360px;
      background: var(--paper-inner); border: 1px solid var(--line);
    }
    .col-page { padding: 18px 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .col-page.left {
      border-right: 1px solid var(--line);
      box-shadow: inset -8px 0 14px -10px rgba(31, 43, 36, 0.14);
    }
    .col-page.right {
      transform-origin: left center;
      transform: perspective(700px) rotateY(-10deg); opacity: 0;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.16s, opacity 0.45s ease 0.16s;
    }
    .scene.active .col-page.right { transform: perspective(700px) rotateY(0deg); opacity: 1; }
    .col-h { font-family: var(--serif); font-size: 22px; margin: 0 0 6px; color: var(--forest); }
    .col-page.right .col-h { color: var(--ochre); }
    .col-d { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
    .col-ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 7px; }
    .col-ul li {
      font-size: 13px; font-weight: 600; padding: 6px 8px;
      border-left: 2.5px solid var(--forest); background: var(--paper);
    }
    .col-page.right .col-ul li { border-left-color: var(--ochre); }

    /* 第 3 幕：手写钢笔下划线例句 */
    .quote-sheet {
      background: var(--paper-inner); border: 1px solid var(--line); padding: 26px 24px;
      height: 100%; max-height: 360px; display: flex; flex-direction: column; justify-content: center; gap: 18px;
    }
    .q-text { font-family: var(--serif); font-size: clamp(19px, 3.6vw, 23px); line-height: 1.65; margin: 0; }
    .ink-hl {
      position: relative; display: inline-block; font-weight: 700; color: var(--ochre); padding: 0 4px;
    }
    .ink-hl::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 3px;
      background: var(--ochre); transform-origin: left; transform: scaleX(0);
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
    }
    .scene.active .ink-hl::after { transform: scaleX(1); }
    .q-trans { font-size: 14px; color: var(--muted); margin: 0; padding-left: 12px; border-left: 2px solid var(--forest); }
    .q-note { background: var(--ochre-soft); border: 1px solid #DEC1B3; padding: 12px 14px; font-size: 13.5px; color: #6B321B; font-weight: 600; line-height: 1.55; }

    /* 第 4 幕：图鉴揭盖遮条答题卡 */
    .quiz-sheet {
      position: relative; height: 100%; background: var(--paper-inner); border: 1px solid var(--line);
      padding: 20px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }
    .q-ask { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.5; margin: 4px 0 12px; }
    .opt-col { display: flex; flex-direction: column; gap: 9px; }
    .opt {
      min-height: 46px; padding: 10px 14px; border: 1px solid var(--line); background: var(--paper);
      color: var(--ink); font-size: 14.5px; font-weight: 600; text-align: left; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .opt:hover { border-color: var(--forest); background: #EBE6D6; }
    .opt.ok { border-color: var(--forest); background: #DDECE3; color: var(--forest); }
    .opt.no { border-color: var(--ochre); background: #F5E1DA; color: var(--ochre); }

    /* 向上推开的纸质答案覆层 */
    .answer-curtain {
      position: absolute; inset: 0; background: #EFEADF;
      border-top: 2px solid var(--forest); padding: 22px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px;
      transform: translateY(102%);
      transition: transform 0.58s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 5;
    }
    .answer-curtain.open { transform: translateY(0); }
    .ans-val { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--forest); margin: 0; }
    .ans-exp { font-size: 14.5px; line-height: 1.65; color: var(--ink); max-width: 90%; margin: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; }

    .ftr {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px;
      font-size: 11.5px; color: var(--muted); flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="folio" aria-label="复古博物手稿学习卡">
      <div class="corner c-tl"></div><div class="corner c-tr"></div>
      <div class="corner c-bl"></div><div class="corner c-br"></div>
      <svg class="paper-tex" aria-hidden="true">
        <filter id="n1"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="100%" height="100%" filter="url(#n1)" />
      </svg>

      <div class="prog-row" id="progRow">
        <div class="prog-track" data-s="0"><div class="prog-fill"></div></div>
        <div class="prog-track" data-s="1"><div class="prog-fill"></div></div>
        <div class="prog-track" data-s="2"><div class="prog-fill"></div></div>
        <div class="prog-track" data-s="3"><div class="prog-fill"></div></div>
      </div>

      <header class="hdr">
        <div class="specimen-meta">
          <span class="fig-no" id="uFig">Fig. 01</span>
          <span class="subj" id="uSubj"></span>
          <span class="unit" id="uUnit"></span>
        </div>
        <div class="ctrls">
          <button class="btn" id="prevBtn" type="button">&lt;</button>
          <button class="btn" id="playBtn" type="button">暂停</button>
          <button class="btn" id="nextBtn" type="button">&gt;</button>
        </div>
      </header>

      <div class="viewport">
        <article class="scene active" data-s="0">
          <div class="plate-box">
            <div class="stamp-ring" id="uIcon"></div>
            <h1 class="latin-word" id="uWord"></h1>
            <p class="meaning" id="uMean"></p>
            <div class="tag-row" id="uChips"></div>
          </div>
        </article>

        <article class="scene" data-s="1">
          <div class="spread">
            <div class="col-page left">
              <div><h2 class="col-h" id="uLTerm"></h2><p class="col-d" id="uLDesc"></p></div>
              <ul class="col-ul" id="uLList"></ul>
            </div>
            <div class="col-page right">
              <div><h2 class="col-h" id="uRTerm"></h2><p class="col-d" id="uRDesc"></p></div>
              <ul class="col-ul" id="uRList"></ul>
            </div>
          </div>
        </article>

        <article class="scene" data-s="2">
          <div class="quote-sheet">
            <p class="q-text" id="uSent"></p>
            <p class="q-trans" id="uTrans"></p>
            <div class="q-note" id="uTip"></div>
          </div>
        </article>

        <article class="scene" data-s="3">
          <div class="quiz-sheet">
            <div>
              <div class="fig-no">Specimen Test · 自测题</div>
              <div class="q-ask" id="uQ"></div>
              <div class="opt-col" id="uOpts"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;color:var(--muted)">4 秒后自动推开答案页签</span>
              <button class="btn" id="revealBtn" type="button">揭晓答案</button>
            </div>
            <div class="answer-curtain" id="curtain">
              <div class="fig-no">Verified Note · 参考解析</div>
              <p class="ans-val" id="uAns"></p>
              <p class="ans-exp" id="uExp"></p>
              <button class="btn" id="replayBtn" type="button">重新浏览</button>
            </div>
          </div>
        </article>
      </div>

      <footer class="ftr">
        <button class="btn" id="demoBtn" type="button" style="height:24px;font-size:11px">切换样例 (1/3)</button>
        <span id="uStage">PLATE I / IV</span>
      </footer>
    </section>
  </main>

  <script>
    const SAMPLES = [
      {
        subject: "Bahasa Melayu", unit: "Penjodoh Bilangan", word: "seutas",
        meaning: "一条 / 一串（用于细长、柔软或成串的物品）",
        chips: ["seutas jam tangan", "seutas rantai", "seutas tali"],
        iconSvg: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14"/><path d="M23 19 L25 8 L39 8 L41 19"/><path d="M23 45 L25 56 L39 56 L41 45"/><path d="M32 25 L32 32 L37 35"/></svg>`,
        compare: {
          left: { term: "seutas", desc: "软、可弯曲或可佩戴的长条物", items: ["jam tangan 手表", "rantai 项链", "tali pinggang 腰带"] },
          right: { term: "sebatang", desc: "长条形、较硬、笔直的物体", items: ["pensel 铅笔", "pokok 树木", "sungai 河流"] }
        },
        sentenceBefore: "Ibu memakai ", sentenceHighlight: "seutas", sentenceAfter: " rantai emas yang cantik ke majlis itu.",
        translation: "妈妈戴着一条漂亮的金项链去参加那个宴会。",
        tip: "博物笔记：能绕在手腕或脖子上的柔软长物（手表/项链/绳子），选 seutas。",
        quiz: { question: "Ayah membeli _____ tali nilon untuk mengikat kotak itu.", options: ["A. sebatang", "B. seutas", "C. sebiji"], answerIndex: 1, answerText: "B. seutas", explain: "tali nilon（尼龙绳）细长且柔软可弯曲，因此量词用 seutas。" }
      },
      {
        subject: "Sains · 科学", unit: "Tahun 4 · 光合作用", word: "Fotosintesis",
        meaning: "植物利用阳光、二氧化碳和水制造养分的过程",
        chips: ["Cahaya matahari 阳光", "Klorofil 叶绿素", "Glukosa + Oksigen"],
        iconSvg: `<svg viewBox="0 0 64 64"><path d="M16 48 C16 24 34 14 50 14 C50 32 40 48 16 48 Z"/><path d="M16 48 L42 22"/></svg>`,
        compare: {
          left: { term: "所需原料", desc: "植物吸入与吸收的条件", items: ["Air 水（根部吸收）", "Karbon dioksida 二氧化碳", "Cahaya & Klorofil 阳光叶绿素"] },
          right: { term: "生成产物", desc: "制造并释放出的物质", items: ["Kanji / Glukosa 糖分淀粉", "Oksigen 氧气（释放到空气）", "Membekalkan tenaga 供能"] }
        },
        sentenceBefore: "Tumbuhan hijau membebaskan ", sentenceHighlight: "oksigen", sentenceAfter: " semasa menjalankan proses fotosintesis.",
        translation: "绿色植物在进行光合作用时会向空气中释放氧气。",
        tip: "记忆法则：吸进 CO₂ + 水 → 晒太阳 → 吐出 O₂ + 储存淀粉。",
        quiz: { question: "Apakah gas yang diserap oleh tumbuhan semasa fotosintesis?", options: ["A. Oksigen", "B. Karbon dioksida", "C. Nitrogen"], answerIndex: 1, answerText: "B. Karbon dioksida", explain: "光合作用需要吸收二氧化碳（Karbon dioksida），同时释放出氧气。" }
      },
      {
        subject: "Sejarah · 历史", unit: "Tahun 4 · 王朝建立", word: "Parameswara",
        meaning: "马六甲苏丹王朝创立者（约 1400 年建国）",
        chips: ["Palembang 巨港", "Temasik 淡马锡", "Melaka 马六甲"],
        iconSvg: `<svg viewBox="0 0 64 64"><path d="M12 46 L16 22 L27 32 L32 14 L37 32 L48 22 L52 46 Z"/><rect x="12" y="46" width="40" height="6" rx="1"/></svg>`,
        compare: {
          left: { term: "地理条件", desc: "天然避风良港", items: ["避开季风吹袭", "深水港停靠商船", "山丘利于瞭望"] },
          right: { term: "建国传说", desc: "鼠鹿踢猎犬", items: ["倚树休息见鼠鹿踢狗", "认为土地充满灵气", "以树名命名 Melaka"] }
        },
        sentenceBefore: "Parameswara menamakan tempat itu Melaka bersempena dengan nama ", sentenceHighlight: "pokok Melaka", sentenceAfter: ".",
        translation: "拜里米苏拉以当时倚靠休息的「马六甲树」为此地命名。",
        tip: "常考要点：马六甲之所以繁荣，是因为避开南北季风且处于东西贸易必经海峡。",
        quiz: { question: "Apakah haiwan yang dilihat oleh Parameswara menendang anjingnya?", options: ["A. Harimau", "B. Pelanduk", "C. Kancil"], answerIndex: 1, answerText: "B. Pelanduk（鼠鹿）", explain: "课本标准记载：Parameswara 见到 pelanduk 勇敢反击猎犬。" }
      }
    ];

    function loadCard() {
      try {
        const raw = new URLSearchParams(location.search).get("d");
        if (!raw) return SAMPLES[0];
        const bin = atob(raw.replace(/-/g, "+").replace(/_/g, "/"));
        return { ...SAMPLES[0], ...JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))) };
      } catch { return SAMPLES[0]; }
    }

    let idx = 0, card = loadCard(), cur = 0, elapsed = 0, playing = true, revealed = false, last = performance.now();
    const DURS = [4200, 4600, 4600, 7000];
    const romans = ["I", "II", "III", "IV"];
    const scenes = [...document.querySelectorAll(".scene")];
    const tracks = [...document.querySelectorAll(".prog-track")];
    const fills = tracks.map(t => t.querySelector(".prog-fill"));
    const curtain = document.getElementById("curtain");

    function render(c) {
      document.getElementById("uSubj").textContent = c.subject;
      document.getElementById("uUnit").textContent = c.unit;
      document.getElementById("uIcon").innerHTML = c.iconSvg || SAMPLES[0].iconSvg;
      document.getElementById("uWord").textContent = c.word;
      document.getElementById("uMean").textContent = c.meaning;
      const ch = document.getElementById("uChips"); ch.innerHTML = "";
      c.chips.forEach(t => { const s = document.createElement("span"); s.className = "spec-tag"; s.textContent = t; ch.appendChild(s); });
      document.getElementById("uLTerm").textContent = c.compare.left.term;
      document.getElementById("uLDesc").textContent = c.compare.left.desc;
      const ul = document.getElementById("uLList"); ul.innerHTML = "";
      c.compare.left.items.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
      document.getElementById("uRTerm").textContent = c.compare.right.term;
      document.getElementById("uRDesc").textContent = c.compare.right.desc;
      const ur = document.getElementById("uRList"); ur.innerHTML = "";
      c.compare.right.items.forEach(t => { const li = document.createElement("li"); li.textContent = t; ur.appendChild(li); });
      const se = document.getElementById("uSent"); se.innerHTML = "";
      se.appendChild(document.createTextNode(c.sentenceBefore));
      const hl = document.createElement("span"); hl.className = "ink-hl"; hl.textContent = c.sentenceHighlight;
      se.appendChild(hl); se.appendChild(document.createTextNode(c.sentenceAfter));
      document.getElementById("uTrans").textContent = c.translation;
      document.getElementById("uTip").textContent = c.tip;
      document.getElementById("uQ").textContent = c.quiz.question;
      document.getElementById("uAns").textContent = c.quiz.answerText;
      document.getElementById("uExp").textContent = c.quiz.explain;
      const op = document.getElementById("uOpts"); op.innerHTML = "";
      c.quiz.options.forEach((o, i) => {
        const b = document.createElement("button"); b.type = "button"; b.className = "opt";
        b.innerHTML = "<span></span><span></span>"; b.firstChild.textContent = o;
        b.onclick = () => {
          const ok = i === c.quiz.answerIndex;
          b.classList.add(ok ? "ok" : "no"); b.lastChild.textContent = ok ? "正确" : "再试";
          if (ok) setTimeout(() => { revealed = true; curtain.classList.add("open"); }, 450);
        };
        op.appendChild(b);
      });
    }

    function go(n) {
      cur = (n + 4) % 4; elapsed = 0; revealed = false; curtain.classList.remove("open");
      scenes.forEach((s, i) => s.classList.toggle("active", i === cur));
      tracks.forEach((t, i) => { t.classList.toggle("done", i < cur); fills[i].style.transform = i < cur ? "scaleX(1)" : "scaleX(0)"; });
      document.getElementById("uStage").textContent = `PLATE ${romans[cur]} / IV`;
      document.querySelectorAll(".opt").forEach(b => { b.classList.remove("ok", "no"); b.lastChild.textContent = ""; });
    }

    function loop(now) {
      const dt = now - last; last = now;
      if (playing) {
        elapsed += dt;
        fills[cur].style.transform = `scaleX(${Math.min(1, elapsed / DURS[cur])})`;
        if (cur === 3 && !revealed && elapsed >= 4000) { revealed = true; curtain.classList.add("open"); }
        if (elapsed >= DURS[cur]) go(cur + 1);
      }
      requestAnimationFrame(loop);
    }

    document.getElementById("playBtn").onclick = (e) => { playing = !playing; e.target.textContent = playing ? "暂停" : "播放"; };
    document.getElementById("prevBtn").onclick = () => go(cur - 1);
    document.getElementById("nextBtn").onclick = () => go(cur + 1);
    document.getElementById("revealBtn").onclick = () => { revealed = !revealed; curtain.classList.toggle("open", revealed); };
    document.getElementById("replayBtn").onclick = () => go(0);
    tracks.forEach(t => t.onclick = () => go(+t.dataset.s));
    document.getElementById("demoBtn").onclick = (e) => {
      idx = (idx + 1) % SAMPLES.length; card = SAMPLES[idx];
      e.target.textContent = `切换样例 (${idx + 1}/${SAMPLES.length})`;
      document.getElementById("uFig").textContent = `Fig. 0${idx + 1}`;
      render(card); go(0);
    };

    render(card); go(0); requestAnimationFrame(loop);
  </script>
</body>
</html>
